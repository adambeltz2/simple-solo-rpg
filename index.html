<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Delve</title>
<style>
:root{--bg:#15110e;--panel:#1f1914;--panel2:#2a2219;--line:#3b3025;--text:#ece1cf;--dim:#a99a88;--gold:#e0b050;--red:#d4604f;--green:#7bbd6e;--blue:#74a8de;--fs:1;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:calc(16px*var(--fs))/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#app{display:flex;flex-direction:column;flex:1;min-height:0}
h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;margin:0 0 .4em;color:var(--gold);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.scr{flex:1;overflow:auto;padding:16px 16px calc(24px + var(--safe));max-width:640px;width:100%;margin:0 auto}
.logo{font-family:Georgia,serif;font-size:3.2rem;letter-spacing:.2em;color:var(--gold);text-align:center;margin:30px 0 0;text-shadow:0 2px 0 #000}
.tag{text-align:center;color:var(--dim);margin:0 0 28px}
.btn{display:block;width:100%;min-height:50px;padding:12px 16px;margin:0 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);text-align:center}
.btn:active{filter:brightness(1.25)}
.btn.primary{background:var(--gold);color:#241a0a;border-color:var(--gold);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.dim{color:var(--dim)}.small{font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);min-height:36px}
.chip.on{background:var(--gold);color:#241a0a;border-color:var(--gold);font-weight:600}
label.f{display:block;margin:12px 0 4px;color:var(--dim);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#120e0b;color:var(--text);font:inherit}
textarea{min-height:90px;resize:vertical}
.cls{display:block;width:100%;text-align:left;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.cls.on{border-color:var(--gold);background:#2d2415}
.cls b{color:var(--gold)}

/* play */
.hud{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px calc(6px);flex:none}
.hud .l1{display:flex;align-items:center;gap:8px}
.hud .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-family:Georgia,serif}
.hud .ib{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 11px;min-height:38px;min-width:42px}
.bar{position:relative;height:16px;background:#120e0b;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9a3a2f,var(--red));transition:width .25s}
.bar span{position:absolute;inset:0;text-align:center;font-size:.72rem;line-height:15px;color:#fff;text-shadow:0 1px 1px #000}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--dim)}
.stats b{color:var(--text);font-weight:600}
.pips{letter-spacing:2px}.pips .on{color:var(--gold)}.pips .al{color:var(--red)}
.log{flex:1;min-height:0;overflow:auto;padding:14px 14px 10px;max-width:640px;width:100%;margin:0 auto;scroll-behavior:smooth}
.log .head{font-family:Georgia,serif;color:var(--gold);margin:18px 0 6px;font-size:1.05rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.log .narr{font-family:Georgia,'Iowan Old Style',serif;font-size:1.04em;margin:8px 0;line-height:1.55}
.log .narr.live::after{content:'\258D';color:var(--gold);animation:bl 1s steps(2) infinite}
.log .narr .ai{font-size:.7em;color:var(--blue);vertical-align:super;margin-left:4px}
@keyframes bl{50%{opacity:0}}
.log .sys{color:var(--dim);font-size:.92em;margin:3px 0}
.log .roll{font:calc(.8em) ui-monospace,Menlo,Consolas,monospace;margin:4px 0;padding:5px 9px;border-radius:8px;background:#120e0b;border-left:3px solid var(--dim)}
.log .roll.ok{border-color:var(--green)}.log .roll.bad{border-color:var(--red)}
.log .dmg{color:var(--red);margin:3px 0}
.log .choice{margin:12px 0 4px;text-align:right;color:var(--blue);font-style:italic}
.acts{flex:none;max-height:56vh;overflow:auto;border-top:1px solid var(--line);background:var(--panel);padding:10px 12px calc(10px + var(--safe))}
.acts .in{max-width:640px;margin:0 auto}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-height:50px}
.opt:active{filter:brightness(1.25)}
.opt small{display:block;color:var(--dim);margin-top:2px;font-size:.8rem}
.opt.hot{border-color:#6a5427}
.opt.cont{background:var(--gold);color:#241a0a;border-color:var(--gold);font-weight:700;text-align:center}
.free{display:flex;gap:8px;margin:2px 0 8px}.free input{flex:1}.free button{flex:none;width:76px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.mini{display:flex;gap:8px;margin-top:4px}.mini button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--dim);font-size:.85rem}
.door b{display:block;color:var(--gold);font-family:Georgia,serif}
.door .k{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;background:#2d2415;color:var(--gold);font-size:.75rem}
.fort{background:#2d2415;border:1px solid #6a5427;border-radius:12px;padding:10px 12px;margin:0 0 8px}

/* combat */
.art{font:13px/1.1 ui-monospace,Menlo,Consolas,monospace;color:var(--gold);white-space:pre;margin:0;text-align:left;min-width:150px}
.foebox{display:flex;gap:12px;align-items:center;justify-content:center;padding:6px 0 8px}
.foes{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.foe{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:6px 10px;min-height:44px}
.foe.sel{border-color:var(--gold)}
.foe .fb{height:7px;border-radius:4px;background:#120e0b;margin-top:4px;overflow:hidden}.foe .fb i{display:block;height:100%;background:var(--red)}
.foe .cd{font-size:.72rem;color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .opt{margin:0;text-align:center;min-height:48px}
.cond{font-size:.8rem;color:var(--blue);margin:2px 0 6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92dvh;overflow:auto;padding:16px 16px calc(20px + var(--safe))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{border:1px solid var(--line);background:var(--panel2);border-radius:10px;width:42px;height:42px;font-size:1.1rem}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 12px}
.abil div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 0;font-size:.75rem;color:var(--dim)}
.abil b{display:block;font-size:1.1rem;color:var(--text)}
.sk{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #2a2219;font-size:.9rem}
.sk.pf b{color:var(--gold)}
.prog{height:10px;border-radius:5px;background:#120e0b;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--gold);width:0}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe));transform:translateX(-50%);background:#000c;color:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;z-index:30;font-size:.9rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.92rem}.kv dt{color:var(--dim)}.kv dd{margin:0}
ul.tight{margin:4px 0 8px;padding-left:20px}ul.tight li{margin:2px 0}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}

.dicehead{font-family:var(--serif,Georgia,serif);font-size:1.6rem;color:var(--gold);margin:4px 0}
.dvrow{display:flex;gap:10px;margin:14px 0}.dvrow .dv{flex:1;min-width:0;text-align:center;font-size:1.5rem;padding:14px 8px}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const mod = (score) => Math.floor((score - 10) / 2);
const sgn = (n) => (n >= 0 ? '+' : '−') + Math.abs(n);
const an = (w) => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;

function hashStr(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* seeded RNG for dungeon generation (replayable from a seed) */
function RNG(seed) {
  const f = mulberry32(typeof seed === 'number' ? seed : hashStr(String(seed)));
  const r = {
    f,
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    chance: (p) => f() < p,
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(f() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    pickN(arr, n) { return r.shuffle(arr).slice(0, n); },
  };
  return r;
}

/* table dice (not seeded: every play-through rolls fresh) */
const dRand = { f: Math.random };
/* Manual-dice state (see 04b_dice.js). tape: every random draw of the action in progress, so it can be replayed. */
const Dice = { mode: 'auto', tape: null, pos: 0, hold: false, def: null, need: null, retry: null };
function rnd() {
  const T = Dice.tape;
  if (!T) return dRand.f();
  if (Dice.pos < T.length && typeof T[Dice.pos] === 'number') return T[Dice.pos++];
  const v = dRand.f();
  T.push(v);
  Dice.pos = T.length;
  return v;
}
const d = (sides) => 1 + Math.floor(rnd() * sides);
const pickR = (arr) => arr[Math.floor(rnd() * arr.length)];
/* The hero's own dice. With a label, and manual dice switched on, the player may enter the values. */
function heroDice(n, sides, label) {
  const T = Dice.tape;
  if (T && label && (Dice.mode === 'all' || (Dice.mode === 'd20' && sides === 20))) {
    if (Dice.pos < T.length && Array.isArray(T[Dice.pos])) return T[Dice.pos++].slice();
    throw { needRoll: { n, sides, label } };
  }
  const out = [];
  for (let i = 0; i < n; i++) out.push(d(sides));
  return out;
}
function rollDice(n, sides, bonus = 0, label) {
  const rolls = heroDice(n, sides, label && bonus ? label + ' (' + (bonus > 0 ? '+' : '−') + Math.abs(bonus) + ' added for you)' : label);
  const total = rolls.reduce((s, v) => s + v, bonus);
  return { total, rolls, bonus };
}
function rollArr(a) { return rollDice(a[0], a[1], a[2] || 0); }
const diceStr = (a) => a[0] + 'd' + a[1] + (a[2] ? (a[2] > 0 ? '+' : '−') + Math.abs(a[2]) : '');
const fill = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (v[k] !== undefined ? v[k] : m));

/* persistence */
const Store = {
  key: 'delve.save.v1',
  mem: null,
  load() {
    try {
      const s = localStorage.getItem(this.key);
      return s ? JSON.parse(s) : this.mem ? JSON.parse(this.mem) : null;
    } catch (e) {
      return this.mem ? JSON.parse(this.mem) : null;
    }
  },
  save(obj) {
    const s = JSON.stringify(obj);
    this.mem = s;
    try { localStorage.setItem(this.key, s); } catch (e) { /* storage full or blocked: memory copy only */ }
  },
  wipe() {
    this.mem = null;
    try { localStorage.removeItem(this.key); } catch (e) { /* ignore */ }
  },
};

/* ---------- game data ---------- */
const SKILLS = {

const SPECIES = {

const BACKGROUNDS = {

const CLASSES = {

  },

  { id: 'grip', n: 'Gauntlets of Grip', d: '+2 Athletics', skill: { athletics: 2 } },
];

/* ---------- monsters ---------- */
const MON = {
  goblin: { n: 'Goblin', ac: 13, hp: 7, atk: 4, dmg: [1, 6, 1], thr: 2, tier: 1, fl: ['pack'], kind: 'humanoid' },

  skeleton: { n: 'Skeleton', ac: 13, hp: 13, atk: 4, dmg: [1, 6, 2], thr: 3, tier: 1, fl: ['undead'], kind: 'undead' },
  zombie: { n: 'Zombie', ac: 8, hp: 22, atk: 3, dmg: [1, 6, 2], thr: 3, tier: 1, fl: ['undead'], kind: 'undead' },
  bandit: { n: 'Bandit', ac: 12, hp: 11, atk: 3, dmg: [1, 6, 1], thr: 2, tier: 1, fl: [], kind: 'humanoid' },
  cultist: { n: 'Cultist', ac: 12, hp: 9, atk: 3, dmg: [1, 6, 1], thr: 2, tier: 1, fl: [], kind: 'humanoid' },
  wolf: { n: 'Wolf', pl: 'Wolves', ac: 13, hp: 11, atk: 4, dmg: [2, 4, 1], thr: 3, tier: 1, fl: ['pack'], kind: 'beast' },
  stirge: { n: 'Stirge', ac: 14, hp: 5, atk: 5, dmg: [1, 4, 3], thr: 2, tier: 1, fl: ['drain'], kind: 'beast' },
  hobgoblin: { n: 'Hobgoblin', ac: 16, hp: 13, atk: 3, dmg: [1, 8, 1], thr: 3, tier: 2, fl: ['pack'], kind: 'humanoid' },
  bugbear: { n: 'Bugbear', ac: 16, hp: 27, atk: 4, dmg: [2, 6, 2], thr: 5, tier: 2, fl: [], kind: 'humanoid' },

const RES_N = { wind: 'Second Wind', surge: 'Action Surge', dodge: 'Uncanny Dodge', slots: 'Spell slots', turn: 'Turn Undead', breath: 'Breath weapon' };

const prof = (h) => 2 + Math.floor((h.level - 1) / 4);
const aMod = (h, a) => mod(h.abil[a]);
const gearList = (h) => (h.gear || []).map((id) => GEAR.find((g) => g.id === id)).filter(Boolean);

function heroSkills(h) {
  const s = new Set(CLASSES[h.cls].skills.slice(0, h.cls === 'rogue' ? 4 : 3));
  BACKGROUNDS[h.bg].skills.forEach((k) => s.add(k));
  if (h.species === 'elf') s.add('perception');
  return s;
}
function skillMod(h, sk) {
  let m = aMod(h, SKILLS[sk].a);
  if (heroSkills(h).has(sk)) m += prof(h);
  gearList(h).forEach((g) => { if (g.skill && g.skill[sk]) m += g.skill[sk]; });
  return m;
}
function saveMod(h, ab) {
  let m = aMod(h, ab);
  if (CLASSES[h.cls].saves.includes(ab)) m += prof(h);
  return m;
}
function heroAC(h) {
  let ac = CLASSES[h.cls].ac(h);
  gearList(h).forEach((g) => { if (g.ac) ac += g.ac; });

}
function atkBonus(h) { return aMod(h, CLASSES[h.cls].wpn.abil) + prof(h) + gearList(h).reduce((s, g) => s + (g.atk || 0), 0); }

function spellDC(h) { return 8 + spellMod(h); }
function calcMaxHP(h) {
  const c = CLASSES[h.cls];
  const con = aMod(h, 'con');
  let hp = c.hd + con + 6;
  for (let l = 2; l <= h.level; l++) hp += Math.max(4, Math.floor(c.hd / 2) + 1 + con + 3);
  if (h.species === 'dwarf') hp += h.level;
  gearList(h).forEach((g) => { if (g.hp) hp += g.hp; });

}
function fortuneMax(h) { return 3 + (h.species === 'human' ? 1 : 0) + gearList(h).reduce((s, g) => s + (g.fort || 0), 0); }
function resMax(h) {
  const L = h.level, c = h.cls, r = {};
  if (c === 'fighter') { r.wind = 1; if (L >= 2) r.surge = 1; }
  if (c === 'rogue' && L >= 5) r.dodge = 1;
  if (c === 'wizard' || c === 'cleric') r.slots = L + 2;
  if (c === 'cleric' && L >= 2) r.turn = 1;
  if (h.species === 'dragonborn') r.breath = 1;
  return r;
}
function recalc(h) {
  const before = h.hpMax || 0;
  h.hpMax = calcMaxHP(h);
  if (!before) h.hp = h.hpMax;
  h.hp = clamp(h.hp, 0, h.hpMax);
}
function newHero(o) {
  const c = CLASSES[o.cls];
  const h = {
    id: 'h' + Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36),
    name: o.name || pickR(HERO_NAMES), species: o.species, cls: o.cls, bg: o.bg, drive: o.drive,
    level: 1, abil: Object.assign({}, c.stats), gold: 0, inv: { potion: 2 }, gear: [], res: {}, fortune: 2,
    legacy: [], chronicle: [], alive: true, adventures: 0, hp: 0, hpMax: 0,
  };
  recalc(h);
  h.hp = h.hpMax;
  h.res = resMax(h);
  h.fortune = 2 + (h.species === 'human' ? 1 : 0);
  return h;
}
function readyHero(h) {
  recalc(h);
  h.hp = h.hpMax;
  h.res = resMax(h);
  h.fortune = Math.min(fortuneMax(h), 2 + (h.species === 'human' ? 1 : 0) + gearList(h).reduce((s, g) => s + (g.fort || 0), 0));

}
function restHero(h, frac) {
  h.res = resMax(h);
  const heal = Math.ceil(h.hpMax * frac);

const LEVEL_NOTES = {
  fighter: { 2: 'Action Surge: take an extra action once per rest.', 3: 'Your training pays off: more HP and a surer hand.', 4: 'STR +2.', 5: 'Extra Attack: you strike twice when you attack.' },
  rogue: { 2: 'Cunning Hide as a bonus action.', 3: 'Sneak Attack grows to 2d6.', 4: 'DEX +2.', 5: 'Uncanny Dodge: halve one hit per rest. Sneak Attack 3d6.' },
  wizard: { 2: 'More spell slots.', 3: 'Scorching Ray learned.', 4: 'INT +2.', 5: 'Fire Bolt grows to 2d10.' },
  cleric: { 2: 'Turn Undead learned.', 3: 'More spell slots.', 4: 'WIS +2.', 5: 'Sacred Flame 2d8, Cure Wounds heals more.' },

function levelUp(h) {
  if (h.level >= 5) return null;
  h.level++;

function passiveLines(h) {

function needWord(m, dc) {

/* ---------- adventure generator (the story spine) ---------- */
function genSeed() { return pickR(SEED_W1) + '-' + pickR(SEED_W2) + '-' + (10 + Math.floor(rnd() * 90)); }

function tierFor(L, rng) {
  if (L <= 1) return 1;
  if (L === 2) return rng.chance(0.3) ? 2 : 1;
  if (L === 3) return 2;
  if (L === 4) return rng.chance(0.35) ? 3 : 2;
  return 3;
}
const budgetFor = (L) => Math.max(3, Math.round((2 + 2 * L) * 0.8));
function pickEnemies(T, L, budget, rng, mul) {
  const keys = [];
  let left = Math.max(2, Math.round(budget * mul));
  const pool = T.mon[tierFor(L, rng)];
  let guard = 0;
  while (left > 0 && keys.length < 5 && guard++ < 24) {
    const cand = pool.filter((k) => MON[k].thr <= left);
    if (!cand.length) break;
    const k = rng.pick(cand);
    keys.push(k);
    left -= MON[k].thr;
    if (keys.length >= 2 && rng.chance(0.25)) break;
  }
  if (!keys.length) keys.push(pool.slice().sort((a, b) => MON[a].thr - MON[b].thr)[0]);
  return keys;
}
function enemyNames(keys) {
  const counts = {};
  keys.forEach((k) => { counts[k] = (counts[k] || 0) + 1; });
  const parts = Object.keys(counts).map((k) => {
    const m = MON[k] || BOSS[k];
    const c = counts[k];
    return c === 1 ? an(m.n.toLowerCase()) : numWord(c) + ' ' + (m.pl || m.n + 's').toLowerCase();
  });
  if (parts.length === 1) return parts[0];
  return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
}
function numWord(n) { return ['no', 'one', 'two', 'three', 'four', 'five', 'six'][n] || String(n); }

const DOOR_HINT = {

  trap: ['a faint metallic click', 'a draft smelling of oil', 'scratch marks on the floor', 'dust disturbed in straight lines'],
  puzzle: ['a pale glow under the door', 'a hum like a struck bell', 'carved symbols around the frame'],
  hazard: ['the sound of running water', 'groaning timber', 'a damp, sour draft'],

const TYPE_LABEL = { combat: 'Danger', trap: 'Trap', puzzle: 'Puzzle', hazard: 'Hazard', lore: 'Secrets', treasure: 'Treasure', rest: 'Shelter', social: 'Someone is here' };

function generateAdventure(seed, hero, opts) {

    adv.npcs.ret = { id: 'ret', name: returning.name, role: 'returning', att: 1, met: false, alive: true, from: returning.t };
    s2a = mk('social', { npc: 'ret', role: 'returning', dcHelp: diff(0), dcTalk: diff(1), dcLie: diff(1), dcThreat: diff(1) });
  } else if (hookKey === 'rescue' && ally && ally.captive) s2a = socialRoom('prisoner');
  else s2a = socialRoom(rng.pick(['deserter', 'scholar', 'rival', 'trader']));
  const s2b = (function () { const t = rng.pick(['combat', 'treasure', 'lore']); return t === 'combat' ? combatRoom(false) : t === 'treasure' ? treasureRoom() : loreRoom(); })();
  const twist = mk('twist', { name: 'turning point', hint: 'something is wrong here', twist: adv.twist.type });
  const s4a = combatRoom(true);
  const s4b = (function () { const t = rng.pick(['puzzle', 'trap', 'hazard', 'lore'].filter((x) => x !== s1b.type)); return { trap: trapRoom, puzzle: puzzleRoom, hazard: hazardRoom, lore: loreRoom }[t](); })();
  const s5a = restRoom();
  const s5b = (function () { const t = rng.pick(['treasure', 'combat', 'lore']); return t === 'combat' ? combatRoom(false) : t === 'treasure' ? treasureRoom() : loreRoom(); })();
  const boss = mk('boss', { name: lair, hint: 'the heart of it', bossKey: villain.bossKey });
  const order = [[entrance], [s1a, s1b], [s2a, s2b], [twist], [s4a, s4b], [s5a, s5b], [boss]];

/* ---------- play engine: state, rolls, effects, scenes ---------- */
let S = null;          // whole save: { settings, heroes, run, fallen }
let run = null;        // current adventure run (S.run)
let hero = null;       // hero in the current run
const ui = { dirty: true, onChange: null, onNarrate: null };

let entryId = 1;

}

/* ---------- dice with context ---------- */
function d20roll(mode, label) {
  const lab = label && (mode > 0 ? label + ' — advantage: roll two, the higher counts' : mode < 0 ? label + ' — disadvantage: roll two, the lower counts' : label);
  const all = heroDice(mode ? 2 : 1, 20, lab);
  let lucky = false;
  if (hero.species === 'halfling') {
    for (let i = 0; i < all.length; i++) if (all[i] === 1) { all[i] = heroDice(1, 20, label && label + ' — halfling luck: roll again for the 1')[0]; lucky = true; }
  }
  if (!mode) return { r: all[0], all: [all[0]], lucky, mode: 0 };
  const r = mode > 0 ? Math.max(all[0], all[1]) : Math.min(all[0], all[1]);
  return { r, all: [all[0], all[1]], lucky, mode };
}
function modeStr(m) { return m > 0 ? ' (advantage)' : m < 0 ? ' (disadvantage)' : ''; }

function doCheck(skill, dc, mode) {
  const m = skillMod(hero, skill);
  const x = d20roll(mode || 0, SKILLS[skill].n + ' check (' + sgn(m) + ' added for you)');
  const total = x.r + m;
  const crit = x.r === 20, fumble = x.r === 1;
  const ok = crit || (!fumble && total >= dc);
  return { skill, dc, m, x, total, ok, crit, fumble };
}
function doSave(abil, dc, mode) {
  const m = saveMod(hero, abil);
  const x = d20roll(mode || 0, ABIL_N[abil] + ' save (' + sgn(m) + ' added for you)');
  const total = x.r + m;
  const ok = x.r === 20 || (x.r !== 1 && total >= dc);
  return { abil, dc, m, x, total, ok };
}
function rollChip(c) {
  const nm = c.skill ? SKILLS[c.skill].n : ABIL_N[c.abil] + ' save';
  const dice = c.x.all.length > 1 ? 'd20 [' + c.x.all.join(', ') + '→' + c.x.r + ']' : 'd20 [' + c.x.r + ']';
  return nm + ': ' + dice + ' ' + sgn(c.m) + ' = ' + c.total + ' vs DC ' + c.dc + ' — ' + (c.crit ? 'critical success' : c.fumble ? 'critical failure' : c.ok ? 'success' : 'failure');
}

/* ---------- ledger helpers ---------- */
const led = () => run.led;
const flag = (k) => !!run.led.flags[k];
function setFlag(k, v) { run.led.flags[k] = v === undefined ? true : v; }
function npcOf(id) { return run.adv.npcs[id]; }

function deed(text) { led().deeds.push(text); }
function queueCb(text) { led().cbs.push(text); if (led().cbs.length > 6) led().cbs.shift(); }
function addAtt(id, n) {
  const p = npcOf(id);
  if (!p) return;
  p.att = clamp(p.att + n, -3, 3);
  p.met = true;
}
function gainFortune(n) {

  hero.fortune = clamp(hero.fortune + n, 0, fortuneMax(hero));
  return hero.fortune - before;
}
function addItem(id, n) { hero.inv[id] = (hero.inv[id] || 0) + (n || 1); }
function hurt(n, type, quiet) {
  if (type === 'poison' && hero.species === 'dwarf') n = Math.ceil(n / 2);

  if (!quiet) say('dmg', 'You take ' + n + (type ? ' ' + type : '') + ' damage. (' + hero.hp + '/' + hero.hpMax + ' HP)');
  return n;
}
function mend(n) {

  hero.hp = clamp(hero.hp + n, 0, hero.hpMax);
  return hero.hp - before;
}
function tickClock(n) {

  c.at = clamp(c.at + n, 0, c.max);
  if (c.at >= c.max && !flag('clock_done')) {
    setFlag('clock_done');

}
function bumpAlert(n) {

}

/* ---------- effects ---------- */
function applyFx(fx, opts) {
  opts = opts || {};
  if (!fx) return { combat: null };
  const out = { combat: null, lines: [] };
  const note = (t) => { out.lines.push(t); say('sys', t); };
  if (fx.hp) {
    if (fx.hp < 0) hurt(-fx.hp, fx.dmgType); else { const g = mend(fx.hp); if (g) note('You recover ' + g + ' HP.'); }
  }
  if (fx.gold) { hero.gold += fx.gold; led().gold += fx.gold; note('+' + fx.gold + ' gold.'); }
  (fx.items || []).forEach((it) => { addItem(it, 1); note('You gain: ' + ITEMS[it].n + '.'); });
  if (fx.gear) {
    if (!hero.gear.includes(fx.gear)) {
      hero.gear.push(fx.gear);
      const g = GEAR.find((x) => x.id === fx.gear);
      recalc(hero);
      if (g && g.hp) hero.hp += g.hp;
      note('Treasure: ' + g.n + ' (' + g.d + ').');
    }
  }
  if (fx.flags) fx.flags.forEach((f) => setFlag(f));
  if (fx.clue) { led().clues += fx.clue; note('🔍 Clue found (' + led().clues + ').'); }
  if (fx.alert) bumpAlert(fx.alert);
  if (fx.clock) tickClock(fx.clock);
  if (fx.fortune) { const g = gainFortune(fx.fortune); if (g > 0) note('✦ +' + g + ' Fortune.'); }
  if (fx.att) Object.keys(fx.att).forEach((id) => addAtt(id, fx.att[id]));
  if (fx.deed) deed(fx.deed);
  if (fx.cb) queueCb(fx.cb);
  if (fx.rest) {
    const frac = fx.rest;
    const g = restHero(hero, frac);
    note('You rest. +' + g + ' HP, and your abilities return.');
  }
  if (fx.legacy) hero.legacy.push(fx.legacy);
  if (fx.ally === 'join') {
    const a = run.adv.npcs.ally;
    if (a && a.alive) { a.active = true; a.captive = false; a.met = true; note(a.name + ' joins you.'); }
  }
  if (fx.ally === 'leave') {
    const a = run.adv.npcs.ally;
    if (a) { a.active = false; a.captive = false; note(a.name + ' heads for safety.'); }
  }
  if (fx.ally === 'betray') {
    const a = run.adv.npcs.ally;
    if (a) { a.betrayer = true; a.active = false; }
  }
  if (fx.curse) { hero.hpMax = Math.max(8, hero.hpMax - fx.curse); hero.hp = Math.min(hero.hp, hero.hpMax); setFlag('cursed'); note('A creeping curse takes ' + fx.curse + ' max HP until you can be cleansed.'); }
  if (fx.combat) out.combat = fx.combat;
  if (fx.setEnd) run.ending = fx.setEnd;
  return out;
}

/* ---------- callbacks (the story remembering you) ---------- */
function callbackLine() {
  const parts = [];
  const a = led().alert;
  if (a >= 4) parts.push('Shouts and the clatter of arms echo behind you. The defenders are hunting.');
  else if (a === 3) parts.push('Somewhere, an alarm bell has been struck. You can feel the place tightening around you.');
  const c = run.adv.clock;
  if (c.at >= c.max - 2 && c.at < c.max) parts.push('The air hums. Whatever is coming is nearly here.');
  const al = allyNow();
  if (al && rnd() < 0.5) parts.push(al.name + ' keeps close, ' + (al.att >= 2 ? 'steady and loyal.' : 'quiet, watching you.'));
  if (led().cbs.length) parts.push(led().cbs.shift());
  return parts.slice(0, 2).join(' ');
}

/* ---------- scene text ---------- */
function themeOf() { return THEMES[run.adv.theme]; }

  const T = themeOf();

}
function roomIntro(room) {

    const m = MON[keys[0]];

/* ---------- manual dice ----------
   Every action handler is a plain synchronous function, so a die the player must enter by hand works by replay:
   run the action on the live state; when it reaches a hero die that has not been entered yet, abort, restore the
   snapshot taken before the action, ask the player for the value, then run the whole action again. Every random
   draw (and every entered value) is kept on a tape, so the second run goes exactly the same way up to that die. */
function syncInto(dst, src) {
  if (Array.isArray(dst)) {
    dst.length = src.length;
    for (let i = 0; i < src.length; i++) dst[i] = mergeVal(dst[i], src[i]);
  } else {
    Object.keys(dst).forEach((k) => { if (!(k in src)) delete dst[k]; });
    Object.keys(src).forEach((k) => { dst[k] = mergeVal(dst[k], src[k]); });
  }
}
function mergeVal(a, b) {
  if (b && typeof b === 'object' && a && typeof a === 'object' && Array.isArray(a) === Array.isArray(b)) { syncInto(a, b); return a; }
  return b;
}
function dicePrompt() { return S && S.settings && S.settings.dice; }
function withDice(fn) {
  const mode = dicePrompt();
  if (Dice.hold || Dice.need || !mode || mode === 'auto') { fn(); return; }
  Dice.mode = mode;
  Dice.tape = [];
  diceAttempt(fn, false);
}
function diceAttempt(fn, again) {
  const snap = JSON.stringify(S), eid = entryId, cd = cid;
  Dice.pos = 0;
  Dice.hold = true;
  Dice.def = { changed: false, narr: [] };
  try {
    fn();
  } catch (e) {
    Dice.hold = false;
    if (e && e.needRoll) {
      syncInto(S, JSON.parse(snap));
      entryId = eid; cid = cd;
      run = S.run;
      hero = run ? S.heroes.find((x) => x.id === run.heroId) : hero;
      Dice.need = e.needRoll;
      Dice.retry = () => diceAttempt(fn, true);
      if (ui.onNeedDice) ui.onNeedDice(Dice.need);
      return;
    }
    diceReset();
    throw e;
  }
  Dice.hold = false;
  const def = Dice.def;
  diceReset();
  def.narr.forEach((p) => { if (ui.onNarrate) ui.onNarrate(p[0], p[1]); });
  if (def.changed || again) changed();
}
function diceReset() {
  Dice.tape = null; Dice.pos = 0; Dice.hold = false; Dice.def = null; Dice.need = null; Dice.retry = null; Dice.mode = 'auto';
}
/* the player's entered values for the die that was asked for */
function diceSupply(values) {
  if (!Dice.need || !Dice.retry) return;
  const retry = Dice.retry;
  Dice.tape.push(values);
  Dice.need = null;
  retry();
}

/* ---------- run lifecycle, rooms, choices ---------- */
function factsFor(kind, draft, extra) {
  const adv = run.adv;
  return Object.assign({
    kind, draft, hero: hero.name + ', ' + SPECIES[hero.species].n + ' ' + CLASSES[hero.cls].n,
    setting: themeOf().n + ' (' + adv.site + ')', story: adv.title, backstory: hero.story || '',
    recent: led().deeds.slice(-2),
  }, extra || {});
}

function beginRun(h, seed, themeKey) {
  hero = h;
  readyHero(h);
  const adv = generateAdventure(seed, h, { theme: themeKey, difficulty: S.settings.difficulty });
  adv.legacyUsed.forEach((l) => {
    const i = h.legacy.findIndex((x) => x.t === l.t && x.name === l.name);
    if (i >= 0) h.legacy.splice(i, 1);
  });
  run = S.run = {
    v: 1, heroId: h.id, adv, slot: 0, phase: 'doors', roomId: null, cur: null,
    led: { flags: {}, clues: 0, alert: 0, gold: 0, deeds: [], cbs: [], kills: 0, spared: 0, visited: [] },
    log: [], combat: null, ending: null, pending: null, epilogue: null,
  };
  say('head', adv.titleFull);
  narr(adv.pitch, factsFor('hook', adv.pitch));
  say('sys', 'Your task: ' + adv.goal);
  const a = adv.npcs.ally;
  if (a && a.active) say('sys', a.name + ', a ' + a.role + ' sent along by ' + adv.patron.name + ', travels with you.');
  if (adv.legacyUsed.length) {
    const l = adv.legacyUsed[0];
    const t = { ally_saved: l.name + ' has not forgotten what you did.', villain_slain: 'This is not the first dark errand like this. The one you slew left kin behind.', villain_spared: 'The mercy you showed ' + l.name + ' has not been forgotten.', npc_helped: l.name + ' remembers you kindly.' }[l.t];
    if (t) say('sys', '↪ ' + t);
  }
  save();
  enterSlot(0);
}

function enterSlot(i) {
  run.slot = i;
  const s = run.adv.slots[i];
  if (s.opts.length === 1) { enterRoom(s.opts[0]); return; }
  run.phase = 'doors';
  run.cur = null;
  say('head', 'Two ways onward');
  changed();
}

function doorInfo(id) {
  const room = run.adv.rooms[id];
  const passive = 10 + skillMod(hero, 'perception');
  const exact = passive >= 13 || flag('scouted');
  return { id, label: cap(room.name), hint: cap(room.hint), exact, kind: exact ? TYPE_LABEL[room.type] || '' : '' };
}
function chooseDoor(id) {
  const info = doorInfo(id);
  say('choice', '→ ' + info.label);
  enterRoom(id);
}

function bossPrep() {
  const adv = run.adv;
  const lines = [], mods = { extra: [], hpMul: 1, atk: 0, dmg: 0, weak: false, allyWith: false };
  const bad = [], good = [];
  if (led().alert >= 4) { mods.extra.push(adv.villain.bossKey === 'necromancer' ? 'skeleton' : MON_FOR_THEME(adv.theme)); mods.extra.push(MON_FOR_THEME(adv.theme)); bad.push('The defenders have been warned. Guards stand ready beside ' + adv.villain.name + '.'); }
  else if (led().alert === 3) { mods.extra.push(MON_FOR_THEME(adv.theme)); bad.push('One guard has been called to the lair.'); }
  if (flag('clock_done')) { mods.hpMul = 1.25; mods.dmg = 2; bad.push('It is too late. ' + adv.clock_text + ' ' + adv.villain.name + ' has been empowered.'); }
  if (led().clues >= 3) { mods.weak = true; good.push('Everything you learned shows you where ' + adv.villain.name + ' is vulnerable.'); }
  else if (led().clues >= 2) good.push('You have a clue to ' + adv.villain.name + "'s weakness, if you can use it.");
  if (flag('sidedoor')) good.push('You have a way in by the side door.');
  const a = adv.npcs.ally;
  if (a && a.alive && a.active) { if (a.att >= 2) good.push(a.name + ' stands beside you, steady.'); }
  Object.keys(adv.npcs).forEach((id) => {
    const n = adv.npcs[id];
    if (id === 'ally') return;
    if (!n.met || !n.alive) return;
    if (n.att >= 2) { mods.weak = true; good.push(n.name + ' has slipped ahead and sown confusion in the lair.'); }
    else if (n.att <= -2) { mods.extra.push(MON_FOR_THEME(adv.theme)); bad.push(n.name + ' ran ahead to warn ' + adv.villain.name + '.'); }
  });
  /* ally betrayal */
  if (adv.twist.type === 'ally_betrays' && a && a.alive && !flag('ally_redeemed') && !flag('ally_slain') && (a.betrayer || a.att < 3)) {
    a.betrayer = true; a.active = false;
    mods.traitor = true;
    bad.push(a.name + ' steps out from behind ' + adv.villain.name + ", weapon drawn. \"Nothing personal.\"");
  }
  return { lines: bad.concat(good), mods };
}
function MON_FOR_THEME(themeKey) {
  const T = THEMES[themeKey];
  const pool = T.mon[tierFor(hero.level, { chance: () => false })];
  return pool.slice().sort((a, b) => MON[a].thr - MON[b].thr)[0];
}

function enterRoom(id) {
  const adv = run.adv;
  const room = adv.rooms[id];
  run.roomId = id;
  run.phase = 'room';
  adv.clock_text = adv.clock_text || ('The ' + adv.clock.label.toLowerCase() + ' came and went.');
  if (room.type !== 'entrance') tickClock(1);
  led().visited.push(id);
  const cb = callbackLine();
  let text, kind = 'room';
  if (room.type === 'entrance') {
    text = 'You stand before ' + adv.site + '. ' + atmosphere() + ' ' + (cb || '') + ' There is no one to ask the way. You will have to choose how you go in.';
    say('head', 'The Threshold');
  } else if (room.type === 'twist') {
    adv.twist.revealed = true;
    const t = adv.twist.type;
    const body = t === 'ally_betrays' ? TWIST_TEXT[t](adv.npcs.ally) : TWIST_TEXT[t](adv);
    text = pickR(TPL.arrive) + ' ' + atmosphere() + ' ' + body;
    say('head', 'A turning point');
    kind = 'twist';
  } else if (room.type === 'boss') {
    const prep = bossPrep();
    run.cur = { prep };
    const boss = BOSS[adv.villain.bossKey];
    text = pickR(TPL.arrive) + ' ' + atmosphere() + ' At last, the ' + room.name + '. ' + adv.villain.name + ', ' + an(boss.n.toLowerCase()) + ', waits.';
    say('head', 'The ' + cap(room.name));
    kind = 'boss';
  } else {
    text = roomIntro(room);
    if (cb) text += ' ' + cb;
    say('head', cap(room.name) + (room.type === 'social' ? ' — ' + (npcOf(room.npc).name) : ''));
  }
  const keep = run.cur && run.cur.prep ? run.cur.prep : null;
  narr(text, factsFor(kind, text));
  if (keep) keep.lines.forEach((l) => say('sys', '⚡ ' + l));
  if (room.type === 'social') npcOf(room.npc).met = true;
  run.cur = { prep: keep, choices: buildChoices(room), acts: 0, resolved: false, driveGiven: false, used: [] };
  save();
  changed();
}

/* ---------- picking a choice ---------- */
function curChoice(cidv) { return run.cur && run.cur.choices.find((x) => x.id === cidv); }
function pickChoice(cidv) {
  if (!run.cur || (run.phase !== 'room')) return;
  const c = curChoice(cidv);
  if (!c) return;
  if (c.id === 'continue') { continueDeeper(); return; }
  if (c.id === 'search') { doSearch(); return; }
  if (c.kind === 'end') { endChoice(c); return; }
  say('choice', c.label);
  if (c.drive && hero.drive === c.drive && !run.cur.driveGiven) {
    run.cur.driveGiven = true;
    if (gainFortune(1) > 0) say('sys', '✦ Your drive stirs (' + DRIVES[c.drive].n + '): +1 Fortune.');
  }
  if (c.kind === 'trade') {
    if (hero.gold < c.cost) { say('sys', 'You cannot afford that (' + c.cost + ' gold).'); changed(); return; }
    hero.gold -= c.cost;
    say('sys', '−' + c.cost + ' gold.');
  }
  if (c.kind === 'check') {
    const res = doCheck(c.skill, c.dc, c.mode || 0);
    say('roll', rollChip(res), { ok: res.ok });
    if (!res.ok && hero.fortune > 0 && !res.crit) {

}

  run.phase = 'room';

}

function finishChoice(c, ok, res) {
  const room = run.adv.rooms[run.roomId];
  const cur = run.cur;
  cur.acts++;
  cur.used.push(c.id);
  let text = ok ? c.ok : c.no;
  if (!text) text = fill(pickR((ok ? TPL.succ : TPL.fail)[c.skill] || ['It is done.']), { obj: room.obj || 'it', Obj: cap(room.obj || 'it') });
  if (res && res.crit) { text += ' A flawless effort.'; if (gainFortune(1) > 0) text += ' (+1 Fortune)'; }
  if (res && res.fumble) text += ' Bad luck.';
  const facts = factsFor('outcome', text, { action: c.label, result: ok ? 'success' : 'failure', place: room.name });
  narr(text, facts);
  if (res && res.fumble) { tickClock(1); }
  let out = { combat: null };
  const fxs = c.kind === 'combat' ? [c.fx] : c.kind === 'check' ? [ok ? c.s : c.f] : [c.s, c.fx];
  fxs.forEach((fx) => {
    if (!fx) return;
    const o = applyFx(fx);
    if (o.combat) out.combat = o.combat;
    if (fx.ally === 'join_ret') promoteReturning();

  if (room.type === 'boss' && run.ending === 'parley') { finishAdventure('parley'); return; }
  if (room.type === 'boss' && run.ending === 'snatch') { finishAdventure('snatch'); return; }
  if (hero.hp <= 0 && !out.combat) { handleDown(); return; }

    startCombat(out.combat, room);
    return;
  }

}
function promoteReturning() {
  const adv = run.adv;
  const r = adv.npcs.ret;
  if (!r || adv.npcs.ally) return;
  adv.allyId = 'ally';
  adv.npcs.ally = { id: 'ally', name: r.name, role: 'sellsword', pr: { o: 'them', p: 'their' }, att: 1, met: true, alive: true, active: true, captive: false, betrayer: false, hp: 10 + 3 * hero.level, hpMax: 10 + 3 * hero.level };

}

/* after any choice: work out what the player may do next in this room */
function settleRoom() {
  const room = run.adv.rooms[run.roomId];
  const cur = run.cur;
  const left = [];
  if (room.type === 'social' && cur.acts < 2) {
    cur.choices.forEach((c) => { if (!cur.used.includes(c.id) && c.kind !== 'combat') left.push(c); });
  }
  cur.resolved = true;
  cur.choices = left.concat([C('Continue deeper', { id: 'continue', kind: 'next' })]);

}
function doSearch() {
  const room = run.adv.rooms[run.roomId];
  const cur = run.cur;
  say('choice', 'Search the area');
  cur.searched = true;
  const res = doCheck('investigation', room.searchDC || dcFor(hero.level, 0), 0);
  say('roll', rollChip(res), { ok: res.ok });
  if (res.ok) {
    const g = rollDice(1, 6).total * (hero.level + 1);
    narr('Behind a fallen shelf and under a loose stone, you find what the previous owners left behind.', factsFor('search', 'You search the area and find hidden valuables.'));
    applyFx({ gold: g, clue: rnd() < 0.5 ? 1 : 0, items: rnd() < 0.35 ? [pickR(['potion', 'oil', 'scroll', 'smoke'])] : [] });
  } else {
    say('sys', 'You find nothing of value.');
  }
  cur.choices = cur.choices.filter((c) => c.id !== 'search');
  save();
  changed();
}
function continueDeeper() {
  say('choice', 'Continue deeper');
  const next = run.slot + 1;
  if (next >= run.adv.slots.length) { finishAdventure(run.ending || 'victory'); return; }
  enterSlot(next);
}

/* ---------- combat ---------- */
function rawD20(mode) {
  const a = d(20), b = mode ? d(20) : null;
  if (!mode) return { r: a, all: [a] };
  return { r: mode > 0 ? Math.max(a, b) : Math.min(a, b), all: [a, b] };
}
function modeOf(adv, dis) { return adv && !dis ? 1 : dis && !adv ? -1 : 0; }

function makeMon(key) {
  const m = MON[key];
  const e = { key, n: m.n, role: m.n, ac: m.ac, hp: m.hp, max: m.hp, atk: m.atk, dmg: m.dmg.slice(), multi: m.multi || 1, fl: m.fl.slice(), kind: m.kind, thr: m.thr, cond: {}, boss: false };
  if (key === 'traitor' && run.adv.npcs.ally) e.n = run.adv.npcs.ally.name;
  return e;
}
function makeBoss(key, mods) {
  const b = BOSS[key];
  const L = hero.level;
  const dm = { story: 0.8, standard: 1, grim: 1.2 }[run.adv.difficulty] || 1;
  const hp = Math.max(16, Math.round(b.hp * (0.35 + 0.13 * L) * (mods.hpMul || 1) * dm));
  let ac = b.ac + Math.floor((L - 3) / 2) - 1 - (mods.weak ? 2 : 0);
  const bonus = b.dmg[2] - 1 + Math.floor((L - 3) / 2) + (mods.dmg || 0) + (run.adv.villain.kin ? 1 : 0);
  return {
    key, n: run.adv.villain.name, role: b.n, ac: Math.max(9, ac), hp: mods.weak ? Math.round(hp * 0.85) : hp, max: hp, atk: Math.max(3, b.atk + (L - 3)),
    dmg: [b.dmg[0], b.dmg[1], Math.max(0, bonus)], multi: L >= 4 ? (b.multi || 1) : 1, fl: b.fl.slice(), kind: b.kind, thr: 10, cond: {}, boss: true,
    sp: b.sp ? Object.assign({}, b.sp, b.sp.k === 'summon' ? { n: L >= 4 ? b.sp.n : 1 } : { dice: [L >= 3 ? b.sp.dice[0] : 2, b.sp.dice[1]] }) : null,
  };
}
function livingEnemies() { return run.combat.enemies.filter((e) => e.hp > 0); }
function enemyById(id) { return run.combat.enemies.find((e) => e.id === id && e.hp > 0); }

function startCombat(spec, room) {
  const adv = run.adv;
  const enemies = [];
  const cb = run.combat = {
    enemies, n: 0, round: 1, boss: !!spec.boss, roomId: room ? room.id : run.roomId, acted: { action: false, bonus: false }, menu: null,
    pc: { poisoned: 0, restrained: false, frightened: 0, shield: false, defending: false, hidden: false, firstAdv: spec.surprise === 'player' || !!spec.weak, sneakUsed: false },
    skip: spec.surprise === 'player', weak: !!spec.weak, startThr: 0, allyHealed: false,
  };
  const add = (e) => { e.id = 'e' + cb.n++; enemies.push(e); cb.startThr += e.thr || 3; return e; };
  if (spec.boss) {
    const prep = run.cur && run.cur.prep ? run.cur.prep : bossPrep();
    const mods = Object.assign({}, prep.mods, spec.weak ? { weak: true } : {});
    add(makeBoss(adv.villain.bossKey, mods));
    (mods.extra || []).forEach((k) => add(makeMon(k)));
    if (mods.traitor && adv.npcs.ally) { const t = add(makeMon('traitor')); t.traitor = true; if (flag('twist_watching')) t.hp = Math.ceil(t.hp * 0.6); }
  } else spec.enemies.forEach((k) => add(makeMon(k)));
  run.phase = 'combat';
  say('head', '⚔ Combat');
  say('sys', 'Foes: ' + enemies.map((e) => e.n + ' (AC ' + e.ac + ', ' + e.hp + ' HP)').join(', ') + '.');
  narr(spec.boss ? 'Steel and spell-light fill the chamber. There is no more room for words.' : 'The moment breaks. Weapons are drawn.', factsFor('combat_start', 'Combat begins against ' + enemyNames(enemies.map((e) => e.key)) + '.', { enemies: enemyNames(enemies.map((e) => e.key)) }));
  let first = 'player';
  if (spec.surprise === 'enemy') { first = 'enemy'; say('sys', 'They strike first!'); }
  else if (spec.surprise === 'player') say('sys', 'You have the drop on them. You act first, with advantage.');
  else {
    const mine = heroDice(1, 20, 'Initiative (' + sgn(aMod(hero, 'dex')) + ' added for you)')[0] + aMod(hero, 'dex');
    const theirs = d(20) + 1 + (led().alert >= 4 ? 3 : 0);
    first = mine >= theirs ? 'player' : 'enemy';
    say('roll', 'Initiative: ' + mine + ' vs ' + theirs + ' — ' + (first === 'player' ? 'you go first' : 'they go first'), { ok: first === 'player' });
  }
  if (cb.weak) say('sys', 'You know where it is weak: your first strike has advantage.');
  if (first === 'enemy') {
    enemyPhase();
    if (!run.combat) return;
    endRound(true);
  }
  save();
  changed();
}

function dmgEnemy(e, amt, label) {
  e.hp -= amt;
  if (e.cond.asleep) e.cond.asleep = 0;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  const cb = run.combat;
  say('sys', fill(pickR(TPL.die), { T: cap(e.n) }));
  led().kills++;
  if (e.traitor) { setFlag('ally_slain'); const a = run.adv.npcs.ally; if (a) a.alive = false; deed('Killed the traitor ' + e.n); }
  if (e.boss) {
    cb.enemies.forEach((x) => { if (x !== e && x.hp > 0) { x.hp = 0; } });
  }
  cb.enemies = cb.enemies.filter((x) => x.hp > 0);
}
function checkWin() {
  const cb = run.combat;
  if (!cb) return true;
  if (cb.enemies.filter((e) => e.hp > 0).length === 0) { winCombat(); return true; }
  return false;
}

/* ----- hero strikes ----- */
function strike(e, o) {
  const cb = run.combat, pc = cb.pc;
  let adv = 0, dis = 0;
  if (pc.hidden || pc.firstAdv || (e.cond.asleep > 0)) adv = 1;
  if (pc.poisoned > 0 || pc.frightened > 0 || pc.restrained) dis = 1;
  const mode = modeOf(adv, dis);
  const x = d20roll(mode, (o.name === 'Attack' ? 'Weapon' : o.name) + ' attack (' + sgn(o.bonus) + ' added for you)');
  const total = x.r + o.bonus;
  const crit = x.r === 20;
  const hit = crit || (x.r !== 1 && total >= e.ac);
  const dice = x.all.length > 1 ? 'd20 [' + x.all.join(', ') + '→' + x.r + ']' : 'd20 [' + x.r + ']';
  const chip = o.name + ': ' + dice + ' ' + sgn(o.bonus) + ' = ' + total + ' vs AC ' + e.ac + (crit ? ' — CRITICAL HIT' : hit ? ' — hit' : ' — miss');
  say('roll', chip, { ok: hit });
  if (!hit) { say('sys', fill(pickR(TPL.miss), { t: e.n, T: cap(e.n) })); return false; }
  let dm = rollDice(o.dice[0] * (crit ? 2 : 1), o.dice[1], o.dice[2] || 0, (o.name === 'Attack' ? 'Weapon' : o.name) + ' damage' + (crit ? ' (critical: dice doubled)' : '')).total;
  let sneak = 0;
  if (o.sneakOk && hero.cls === 'rogue' && !pc.sneakUsed && (mode > 0 || allyNow())) {
    sneak = rollDice(Math.ceil(hero.level / 2) * (crit ? 2 : 1), 6, 0, 'Sneak Attack damage').total;
    pc.sneakUsed = true;
  }
  const total2 = dm + sneak;
  say('sys', fill(pickR(TPL.hit), { t: e.n }) + ' ' + total2 + ' damage' + (sneak ? ' (including ' + sneak + ' Sneak Attack)' : '') + '.');
  dmgEnemy(e, total2);
  return true;
}
function weaponStrike(e) {
  const w = CLASSES[hero.cls].wpn;
  const bonusDmg = hero.cls === 'fighter' ? 2 : hero.cls === 'cleric' ? 1 : 0;
  return strike(e, { name: 'Attack', bonus: atkBonus(hero), dice: [1, w.die, aMod(hero, w.abil) + bonusDmg], sneakOk: true });
}
function pickAlive(prefId) {
  const cb = run.combat;
  return enemyById(prefId) || cb.enemies.find((e) => e.hp > 0) || null;
}
function afterAttackFlags() {
  const pc = run.combat && run.combat.pc;
  if (pc) { pc.hidden = false; pc.firstAdv = false; }
}

function spendRes(res) {
  if (!res) return true;
  if ((hero.res[res] || 0) < 1) return false;
  hero.res[res]--;
  return true;
}

function cAct(name, targetId) {
  const cb = run.combat;
  if (!cb || run.phase !== 'combat') return;
  cb.menu = null;
  const acted = cb.acted;
  const L = hero.level;
  if (name === 'attack') {
    if (acted.action) return;
    let e = pickAlive(targetId);
    if (!e) return;
    weaponStrike(e);
    if (run.combat && hero.cls === 'fighter' && L >= 5 && run.combat.enemies.length) { const e2 = pickAlive(targetId); if (e2) { say('sys', 'Extra Attack!'); weaponStrike(e2); } }
    if (!run.combat) return;
    afterAttackFlags();
    acted.action = true;
    if (checkWin()) return;
    endPlayerTurn();
    return;
  }
  if (name === 'defend') {
    if (acted.action) return;
    acted.action = true;
    cb.pc.defending = true;
    say('sys', 'You take a defensive stance. Attacks against you have disadvantage until your next turn.');
    endPlayerTurn();
    return;
  }
  if (name === 'flee') {
    if (acted.action) return;
    if (cb.boss) { say('sys', 'There is nowhere to run. Not from this.'); changed(); return; }
    acted.action = true;
    const dc = 10 + Math.min(4, livingEnemies().length);
    const res = doCheck('acrobatics', dc, 0);
    say('roll', rollChip(res), { ok: res.ok });
    if (res.ok) { fled('You break away and escape.'); return; }
    say('sys', 'They cut you off.');
    endPlayerTurn();
    return;
  }

}
function fled(msg) {
  const cb = run.combat;
  const room = run.adv.rooms[cb.roomId];
  run.combat = null;
  run.phase = 'room';
  say('sys', msg);
  bumpAlert(1);
  deed('Fled from ' + (room ? room.name : 'a fight'));
  setFlag('fled_' + cb.roomId);
  narr('You scramble clear, lungs burning, leaving the fight behind.', factsFor('flee', 'You escape the fight and leave your foes behind.'));
  run.cur.resolved = true;
  run.cur.choices = [C('Continue deeper', { id: 'continue', kind: 'next' })];
  save();
  changed();
}

function useCombatItem(id, targetId) {
  const cb = run.combat;
  const acted = cb.acted;
  if ((hero.inv[id] || 0) < 1) return;
  if (id === 'potion') {
    if (acted.bonus) return;
    hero.inv.potion--;
    const r = rollDice(2, 4, 2, 'Healing potion');
    const g = mend(r.total);
    acted.bonus = true;
    say('sys', 'You drink a potion: +' + g + ' HP (' + hero.hp + '/' + hero.hpMax + ').');
    changed();
    return;
  }
  if (acted.action) return;
  if (id === 'smoke') {
    hero.inv.smoke--;
    acted.action = true;
    if (cb.boss) { say('sys', 'The smoke billows. You vanish from view, and the fight eases for a moment.'); cb.pc.hidden = true; endPlayerTurn(); return; }
    fled('You smash the smoke bomb and slip away in the haze.');
    return;
  }
  const e = pickAlive(targetId);

  hero.inv[id]--;

function usePower(id, targetId) {

  if (p.t === 'bonus' && acted.bonus) return;
  if (p.res && (hero.res[p.res] || 0) < 1) { say('sys', 'You have none of that left.'); changed(); return; }
  if (p.tgt && !pickAlive(targetId)) return;
  const e = p.tgt ? pickAlive(targetId) : null;
  spendRes(p.res);
  if (p.t === 'action') acted.action = true;
  if (p.t === 'bonus') acted.bonus = true;

    case 'second_wind': { const r = rollDice(1, 10, L, 'Second Wind healing'); const g = mend(r.total); say('sys', 'Second Wind: +' + g + ' HP (' + hero.hp + '/' + hero.hpMax + ').'); break; }
    case 'action_surge': { acted.action = false; say('sys', 'Action Surge! You take another action.'); usedAction = false; break; }
    case 'hide': {
      const dc = 12 + Math.floor(L / 2);
      const res = doCheck('stealth', dc, 0);
      say('roll', rollChip(res), { ok: res.ok });
      if (res.ok) { pc.hidden = true; say('sys', 'You vanish from sight. Your next attack has advantage and Sneak Attack.'); }
      else say('sys', 'They see you.');
      break;
    }
    case 'firebolt': { strike(e, { name: 'Fire Bolt', bonus: sm, dice: [L >= 5 ? 2 : 1, 10, 0], sneakOk: false }); afterAttackFlags(); break; }
    case 'magic_missile': {
      const tot = rollDice(3, 4, 3, 'Magic Missile damage (three darts)').total;
      say('sys', 'Three darts of force streak out: ' + tot + ' damage to ' + e.n + '.');
      dmgEnemy(e, tot);
      break;
    }
    case 'shield': pc.shield = true; say('sys', 'A shimmering barrier springs up: +5 AC until your next turn.'); break;
    case 'sleep': {
      let pool = rollDice(5, 8, 0, 'Sleep (hit points of foes it can affect)').total;
      const targets = livingEnemies().filter((x) => !x.fl.includes('undead')).sort((a, b) => a.hp - b.hp);
      let n = 0;
      targets.forEach((x) => { if (x.hp <= pool && !x.boss) { pool -= x.hp; x.cond.asleep = 3; n++; } });
      say('sys', n ? 'Sleep: ' + n + ' foe' + (n > 1 ? 's' : '') + ' slump into slumber (3 rounds, or until hurt).' : 'Sleep: nothing falls asleep.');
      break;
    }
    case 'scorching_ray': {
      for (let i = 0; i < 3; i++) {
        const t = pickAlive(targetId);
        if (!t) break;
        strike(t, { name: 'Ray ' + (i + 1), bonus: sm, dice: [2, 6, 0], sneakOk: false });
        if (!run.combat) return;
      }
      afterAttackFlags();
      break;
    }
    case 'sacred_flame': {
      const dc = spellDC(hero);
      const sv = d(20) + 1;
      if (sv >= dc) say('sys', e.n + ' resists the radiance (' + sv + ' vs DC ' + dc + ').');
      else { const dm = rollDice(L >= 5 ? 2 : 1, 8).total; say('sys', 'Radiant fire falls on ' + e.n + ': ' + dm + ' damage.'); dmgEnemy(e, dm); }
      break;
    }
    case 'cure_wounds': { const r = rollDice(L >= 5 ? 2 : 1, 8, aMod(hero, 'wis'), 'Cure Wounds healing'); const g = mend(Math.max(1, r.total)); say('sys', 'Cure Wounds: +' + g + ' HP (' + hero.hp + '/' + hero.hpMax + ').'); break; }
    case 'guiding_bolt': { strike(e, { name: 'Guiding Bolt', bonus: sm, dice: [4, 6, 0], sneakOk: false }); afterAttackFlags(); break; }
    case 'turn_undead': {
      const dc = spellDC(hero);
      let n = 0;
      livingEnemies().forEach((x) => { if (x.fl.includes('undead')) { const sv = d(20); if (sv + 0 < dc) { x.cond.turned = 2; n++; } } });
      say('sys', n ? 'Turn Undead: ' + n + ' recoil and flee for two rounds.' : 'Turn Undead: nothing here answers to it.');
      break;
    }
    case 'breath': {
      const dc = 8 + prof(hero) + aMod(hero, 'con');
      const dmg = rollDice(L >= 5 ? 3 : 2, 6, 0, 'Breath weapon damage').total;
      say('sys', 'You exhale a cone of fire.');
      livingEnemies().forEach((x) => { const sv = d(20) + 1; const dm = sv >= dc ? Math.floor(dmg / 2) : dmg; say('sys', x.n + (sv >= dc ? ' dodges for half: ' : ' is caught: ') + dm + '.'); dmgEnemy(x, dm); });
      break;
    }
    default: break;
  }

  if (checkWin()) return;
  if (usedAction) { endPlayerTurn(); return; }
  save();
  changed();
}

/* ----- the rest of the round ----- */
function endPlayerTurn() {
  const cb = run.combat;
  if (!cb) return;
  if (checkWin()) return;
  allyTurn();
  if (!run.combat || checkWin()) return;
  if (cb.skip) { cb.skip = false; say('sys', 'The enemy is still reeling from your ambush.'); }
  else enemyPhase();
  if (!run.combat) return;
  endRound(false);
}
function endRound(initial) {
  const cb = run.combat;
  const pc = cb.pc;
  cb.round++;
  if (pc.poisoned > 0) pc.poisoned--;
  if (pc.frightened > 0) pc.frightened--;
  cb.enemies.forEach((e) => { ['asleep', 'turned'].forEach((k) => { if (e.cond[k] > 0) e.cond[k]--; }); });
  cb.acted = { action: false, bonus: false };
  pc.shield = false; pc.defending = false; pc.sneakUsed = false;
  say('sys', '— Round ' + cb.round + ' —');
  save();
  changed();
}
function allyTurn() {
  const cb = run.combat;
  const a = allyNow();
  if (!a || !cb) return;
  if (a.role === 'priest' && hero.hp < hero.hpMax * 0.5 && !cb.allyHealed) {
    cb.allyHealed = true;
    const g = mend(rollDice(1, 6, 2 + hero.level).total);
    say('sys', a.name + ' lays a hand on you: +' + g + ' HP.');
    return;
  }
  const alive = livingEnemies();
  if (!alive.length) return;
  const t = alive[Math.floor(rnd() * alive.length)];
  const bonus = 3 + Math.floor(hero.level / 2);
  const x = rawD20(0);
  if (x.r !== 1 && (x.r === 20 || x.r + bonus >= t.ac)) {
    const dm = rollDice(1, a.role === 'sellsword' ? 8 : a.role === 'scout' ? 6 : 4, 2 + Math.floor(hero.level / 2)).total * (x.r === 20 ? 2 : 1);
    say('sys', a.name + ' strikes ' + t.n + ': ' + dm + ' damage.');

}
function enemyPhase() {
  const cb = run.combat;
  const list = cb.enemies.filter((e) => e.hp > 0);
  for (let k = 0; k < list.length; k++) {
    const e = list[k];
    if (!run.combat) return;
    if (e.hp <= 0) continue;
    if (e.cond.asleep > 0 || e.cond.turned > 0) continue;
    if (e.sp && cb.round >= 2 && (cb.round - 2) % e.sp.every === 0) {
      if (e.sp.k === 'summon' && cb.enemies.length < 6) {
        for (let i = 0; i < e.sp.n; i++) { const m = makeMon(e.sp.key); m.id = 'e' + cb.n++; cb.enemies.push(m); }
        say('sys', '⚠ ' + e.n + ' calls for aid: ' + e.sp.n + ' more ' + (MON[e.sp.key].pl || MON[e.sp.key].n + 's').toLowerCase() + ' join the fight.');
        continue;

      if (e.sp.k === 'breath') {

        const sv = doSave('dex', e.sp.dc, 0);
        say('roll', e.n + ' unleashes a gout of ' + e.sp.type + '! ' + rollChip(sv), { ok: sv.ok });

}
function enemyAttack(e) {
  const cb = run.combat, pc = cb.pc;

      const dm = rollArr(e.dmg).total;

    } else say('sys', e.n + ' swings at ' + A.name + ' and misses.');
    return;
  }
  let adv = 0, dis = 0;
  if (e.fl.includes('pack') && cb.enemies.some((x) => x !== e && x.hp > 0)) adv = 1;
  if (pc.restrained) adv = 1;

  const mode = modeOf(adv, dis);
  const x = rawD20(mode);

  const crit = x.r === 20;

  const dtxt = x.all.length > 1 ? '[' + x.all.join(', ') + '→' + x.r + ']' : '[' + x.r + ']';
  if (!hit) {

    return;
  }
  let dm = rollDice(e.dmg[0] * (crit ? 2 : 1), e.dmg[1], e.dmg[2]).total;
  if (hero.cls === 'rogue' && hero.level >= 5 && (hero.res.dodge || 0) > 0) { hero.res.dodge--; dm = Math.ceil(dm / 2); say('sys', 'Uncanny Dodge halves the blow.'); }
  say('sys', fill(pickR(TPL.ehit), { E: cap(e.n) }) + (crit ? ' (critical)' : '') + ' (d20 ' + dtxt + ' ' + sgn(e.atk) + ' vs AC ' + ac + ')');
  hurt(dm, null);
  if (e.fl.includes('drain') && dm > 0) { const h = Math.floor(dm / 2); e.hp = Math.min(e.max, e.hp + h); say('sys', e.n + ' drinks in your vitality (+' + h + ').'); }
  if (hero.hp <= 0) return;
  if (e.fl.includes('web') && !pc.restrained && rnd() < 0.5) {
    const sv = doSave('dex', 12, 0);

  }

    say('roll', rollChip(sv), { ok: sv.ok });

  }
  if (e.fl.includes('fear') && pc.frightened <= 0 && rnd() < 0.5) {

}

/* ----- victory and defeat ----- */

function endChoice(c) {

function deathSaves() {

    if (r === 20) { marks.push('★'); return { out: 'revived', marks }; }
    if (r === 1) { f += 2; marks.push('✗✗'); }

  bumpAlert(2);
  tickClock(2);
  setFlag('defeated');

/* ---------- epilogue ---------- */
function finishAdventure(kind) {
  const adv = run.adv, v = adv.villain, T = themeOf();
  const a = adv.npcs.ally;
  run.phase = 'epilogue';
  run.combat = null;
  const win = ['slain', 'spared', 'bound', 'parley', 'snatch', 'victory'].includes(kind);
  run.ending = kind;
  const paras = [];
  say('head', 'Epilogue');
  const core = {
    slain: v.name + ' falls, and ' + adv.site + ' goes quiet.',
    spared: 'You lower your blade. ' + v.name + ' watches you go, unsure whether to thank you or curse you.',
    bound: 'You bind ' + v.name + ' and march them out into the daylight to face judgment.',
    parley: 'Words do what steel could not. ' + v.name + ' agrees to end what began here, on terms you both can live with.',
    snatch: 'You escape with ' + adv.mcg + ', and ' + v.name + "'s curses follow you out of " + adv.site + '.',
    victory: v.name + ' is finished.',
    defeat: 'You wake outside ' + adv.site + ', bruised and alone. ' + v.name + "'s plan goes on without you.",
    death: 'Your story ends in the dark of ' + adv.site + '. The stones keep your name.',
  }[kind];
  paras.push(core);

  /* hook consequences */
  const h = adv.hook;
  if (win || kind === 'defeat') {
    if (h === 'rescue' && a) {
      if (flag('ally_slain')) paras.push(a.name + ' betrayed you, and paid for it. It is not a victory anyone will sing about.');
      else if (a.betrayer && a.alive) paras.push(a.name + ' vanished into the dark after the betrayal. You may meet again.');
      else if (!a.alive) paras.push(a.name + ' did not make it out. You carry that, and so does ' + adv.patron.name + '.');
      else if (flag('ally_abandoned') && !a.active) paras.push('You left ' + a.name + ' behind. When you returned, there was nothing but ropes.');
      else if (a.captive) paras.push('You never found ' + a.name + ' in time.');
      else if (flag('ally_left_safe')) paras.push(a.name + ' was waiting at the door when you came out, grinning like it was a game.');
      else paras.push(a.name + ' walks home beside you, tired and alive.');
    } else if (h === 'recover') {
      if (flag('relic_destroyed')) paras.push(adv.mcg + ' is gone for good. ' + adv.patron.name + ' will have to take your word for it.');
      else if (flag('relic_kept')) paras.push('You kept ' + adv.mcg + '. Its whispers follow you down the road.');
      else if (win && kind !== 'defeat') paras.push('You carry ' + adv.mcg + ' back to ' + adv.place + '.');
      else paras.push(adv.mcg + ' is still down there.');
    } else if (h === 'ritual') {
      paras.push(flag('clock_done') ? 'The rite finished before you could stop it, and ' + adv.place + ' will feel it.' : 'The rite died with ' + v.name + "'s plans.");
    } else if (h === 'hunt') {
      paras.push(kind === 'slain' || kind === 'bound' ? 'The hunting stops, and ' + adv.place + ' sleeps without fear.' : kind === 'defeat' ? 'The hunting goes on.' : 'The hunting stops, for now.');
    } else if (h === 'investigate') {
      paras.push(kind === 'defeat' ? 'People are still vanishing, and now you know why.' : 'You bring the truth back to ' + adv.place + '. People stop vanishing.');
    }
  }
  /* twist consequences */
  const t = adv.twist.type;
  let reward = adv.reward;
  if (win) {
    if (t === 'patron_lied') {
      if (flag('sided_villain') && !flag('sided_patron')) { paras.push('You tell the village the truth. ' + adv.patron.name + ' is gone by morning, and no payment comes.'); reward = 0; }
      else if (flag('patron_truth')) paras.push('With the letter in hand, you make sure ' + adv.patron.name + ' answers for it.');
      else paras.push('You deliver the news. ' + adv.patron.name + ' pays, smiling thinly. You do not quite trust that smile.');
    } else if (t === 'villain_sympathetic') {
      if (kind === 'parley' || kind === 'spared') paras.push(v.name + "'s grief finds a better outlet than blood.");
      else if (kind === 'slain') paras.push('You think, sometimes, about what was written in that ledger.');
    } else if (t === 'ally_betrays' && flag('ally_redeemed')) {
      paras.push(a.name + ' gets a chance to start over, because you offered one.');
    }
  }
  if (flag('clock_done') && win) reward = Math.round(reward * 0.7);
  if (flag('relic_kept')) reward = Math.round(reward * 0.5);
  if (win && reward > 0) {
    hero.gold += reward;
    paras.push(adv.patron.name + ' pays you ' + reward + ' gold.');
  }
  /* what the story remembers */
  if (a && a.alive && !a.betrayer && !a.captive && h === 'rescue' && !flag('ally_abandoned') && win) hero.legacy.push({ t: 'ally_saved', name: a.name });
  Object.keys(adv.npcs).forEach((id) => {
    const n = adv.npcs[id];
    if (id !== 'ally' && n.met && n.alive && n.att >= 2 && !hero.legacy.some((l) => l.name === n.name)) hero.legacy.push({ t: 'npc_helped', name: n.name });
  });
  hero.legacy = hero.legacy.slice(-4);
  /* leveling */
  let lv = null;
  if (win && hero.level < 5) lv = levelUp(hero);
  if (win) hero.adventures++;
  if (kind === 'death') { hero.alive = false; }
  const deeds = led().deeds.slice(-6);
  hero.chronicle.push({ title: adv.titleFull, end: kind, level: hero.level, deeds, seed: adv.seed });
  hero.chronicle = hero.chronicle.slice(-12);
  if (kind === 'death') {
    S.heroes = S.heroes.filter((x) => x.id !== hero.id);
    S.fallen.push({ name: hero.name, cls: hero.cls, species: hero.species, level: hero.level, adventures: hero.adventures, title: adv.titleFull, deeds });
  }
  paras.forEach((p, i) => narr(p, factsFor('epilogue', p)));
  if (deeds.length) say('sys', 'Deeds: ' + deeds.join(' • '));
  if (lv) say('sys', '⬆ You reach level ' + hero.level + '! +' + lv.gain + ' max HP. ' + lv.note);
  else if (win && hero.level >= 5) say('sys', 'You are at the height of your power for now.');
  run.epilogue = { kind, win, title: adv.titleFull, reward, level: lv };
  save();
  changed();
}

  S.run = null;
  run = null;

/* ---------- optional on-device narrator (WebLLM) ---------- */
const MODELS = {

  small: { label: 'Small: Qwen2.5 1.5B', id: 'Qwen2.5-1.5B-Instruct', size: '~1 GB', note: 'Recommended balance.' },

      });

  async chat(messages, o) {

const aiOn = () => S && S.settings.narrator === 'ai' && AI.status === 'ready' && !!AI.engine;

const NARR_SYS = 'You are the narrator of a solo fantasy dungeon-crawl tabletop game. Rewrite the DRAFT as vivid prose in second person, present tense. Keep every fact, name, number and outcome exactly as written. Never add new characters, items, monsters or events. Never offer choices or ask questions. Output only the rewritten passage, 2 to 4 sentences.';
function cleanNarration(t, draft) {
  t = String(t || '').replace(/^\s*(narrator|passage|rewritten passage)\s*:\s*/i, '').replace(/[*_#`>]/g, '').replace(/\s+\n/g, '\n').trim();
  if (t.length < 25) return null;
  if (/^(draft|sure|certainly|here)/i.test(t)) return null;
  const m = t.match(/^[\s\S]*[.!?]["')]?/);
  if (m && m[0].length > 40) t = m[0];

  return t;

    const text = await AI.chat([{ role: 'system', content: NARR_SYS }, { role: 'user', content: lines.join('\n') }], {
      max: long ? 170 : 120,
      onToken: (t) => { last = t; if (!job.aborted) { e.t = t; if (ui.onEntry) ui.onEntry(e); } },
    });

/* ---------- free-text actions ---------- */
const APPROACHES = Object.keys(SKILLS).concat(['attack']);
const KEYWORDS = [
  [/\b(sneak|hide|creep|quiet|shadow|stealth|tiptoe)/i, 'stealth'],
  [/\b(pick|lock|disarm|tinker|steal|pocket|jimmy|unlatch)/i, 'sleight'],
  [/\b(persuade|talk|ask|negotiate|convince|plead|bargain|charm|reason|befriend|appeal)/i, 'persuasion'],
  [/\b(lie|trick|bluff|deceive|pretend|disguise|fake|con)\b/i, 'deception'],
  [/\b(threat|intimidat|scare|menace|growl|demand|bully|terrif)/i, 'intimidation'],
  [/\b(search|examine|inspect|study|investigate|check|look closely|analy|probe|poke)/i, 'investigation'],
  [/\b(listen|watch|scout|notice|look|peek|spot|observe)/i, 'perception'],
  [/\b(climb|jump|push|break|lift|bash|force|smash|shove|kick|heave|ram|drag|wedge)/i, 'athletics'],
  [/\b(dodge|roll|leap|swing|vault|balance|duck|dash|tumble|slide)/i, 'acrobatics'],
  [/\b(spell|magic|arcane|cast|dispel|rune|glyph|enchant|ward|fire|lightning)/i, 'arcana'],
  [/\b(pray|holy|bless|faith|divine|god|sacred|incense|altar)/i, 'religion'],
  [/\b(heal|bandage|treat|cure|medic|tend|poultice)/i, 'medicine'],
  [/\b(recall|lore|remember|history|read|legend|scholar|translate)/i, 'history'],
  [/\b(track|forage|survive|navigate|trail|follow)/i, 'survival'],
  [/\b(nature|beast|animal|plant|herb|calm|tame|mushroom)/i, 'nature'],
  [/\b(sense|insight|motive|read them|mood|truth)/i, 'insight'],
  [/\b(attack|kill|stab|slash|fight|strike|charge|slay|hit|shoot)/i, 'attack'],
];
function keywordIntent(text) {
  for (let i = 0; i < KEYWORDS.length; i++) if (KEYWORDS[i][0].test(text)) return KEYWORDS[i][1];
  /* no keyword: use whatever the hero is best at among broad skills */
  const pool = ['investigation', 'perception', 'persuasion', 'athletics', 'insight'];
  return pool.slice().sort((a, b) => skillMod(hero, b) - skillMod(hero, a))[0];
}
async function parseIntent(text) {
  if (aiOn()) {
    try {
      const schema = { type: 'object', properties: { approach: { type: 'string', enum: APPROACHES } }, required: ['approach'] };
      const out = await AI.chat([
        { role: 'system', content: 'Classify a fantasy tabletop RPG player action into one approach. Reply as JSON. Skills: ' + APPROACHES.join(', ') + '. "attack" means starting violence.' },
        { role: 'user', content: 'Action: "' + String(text).slice(0, 200).replace(/"/g, "'") + '"' },
      ], { json: schema, max: 40 });
      const j = JSON.parse(out);
      if (j && APPROACHES.includes(j.approach)) return j.approach;
    } catch (e) { /* fall back to keywords */ }
  }
  return keywordIntent(text);
}
const FREE_TYPES = ['combat', 'trap', 'puzzle', 'hazard', 'lore', 'treasure', 'social', 'entrance'];
function canFreeAct() {
  if (!run || run.phase !== 'room' || !run.cur) return false;
  const room = run.adv.rooms[run.roomId];
  if (!FREE_TYPES.includes(room.type)) return false;
  if (room.type === 'social') return run.cur.acts < 2;
  return !run.cur.resolved;
}
async function freeAction(text) {
  text = String(text || '').trim().slice(0, 140);
  if (!text || !canFreeAct()) return;
  const roomId = run.roomId;
  const skillKey = await parseIntent(text);
  if (!run || run.roomId !== roomId || !canFreeAct()) return;
  withDice(() => resolveFree(text, skillKey, roomId));
}
function resolveFree(text, skillKey, roomId) {
  const room = run.adv.rooms[roomId];
  const L = hero.level;
  let skill = skillKey === 'attack' ? 'athletics' : skillKey;
  let dc = room.dc || room.ambushDC || room.dcTalk || dcFor(L, 0);
  const g = genericFx(room);
  let s = g.s, f = g.f;
  if (room.type === 'combat') {
    dc = skill === 'stealth' ? room.ambushDC : room.talkDC + 1;
    if (skillKey === 'attack') { run.cur.choices.push(C('✎ ' + text, { kind: 'combat', fx: { combat: { enemies: room.enemies, surprise: null } } })); pickChoice(run.cur.choices[run.cur.choices.length - 1].id); return; }
    s = { combat: { enemies: room.enemies, surprise: 'player' } };
    f = { combat: { enemies: room.enemies, surprise: 'enemy' } };
  } else if (room.type === 'social') {
    const id = room.npc;
    dc = room.dcTalk;
    s = { att: { [id]: 1 }, clue: 1 };
    f = { att: { [id]: -1 } };
  } else if (room.type === 'entrance') {
    s = { flags: ['quiet_start'], clue: 0 };
    f = { alert: 1 };
  } else {
    if (room.good && room.good.includes(skill)) dc -= 2;
    else if (skill !== room.skill && skill !== room.alt) dc += 2;
  }
  const ok = fill(pickR(TPL.succ[skill]), { obj: room.obj || 'it', Obj: cap(room.obj || 'it') });
  const no = fill(pickR(TPL.fail[skill]), { obj: room.obj || 'it', Obj: cap(room.obj || 'it') });
  const c = C('✎ ' + text, { kind: 'check', skill, dc, s, f, ok, no, drive: 'curiosity' });
  run.cur.choices.push(c);
  pickChoice(c.id);
}
